name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Release Qualification (CI-019, CI-020)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify quality, types, security, and full test/evaluation suite
        run: |
          ruff format --check .
          ruff check .
          ruff check --select S src/
          mypy src/
          pytest --cov=structa_maestro --cov-fail-under=80
          pytest tests/evaluation/ tests/compatibility/ -v
      - name: Build and verify release artifacts
        run: |
          python -m build
          twine check dist/*
          python -m venv /tmp/release-whl
          /tmp/release-whl/bin/pip install dist/*.whl
          /tmp/release-whl/bin/python -c "import structa_maestro; print(structa_maestro.__version__)"
          /tmp/release-whl/bin/structa-maestro --help
          python -m venv /tmp/release-sdist
          /tmp/release-sdist/bin/pip install dist/*.tar.gz
          /tmp/release-sdist/bin/python -c "import structa_maestro"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: dist/

  formal-assurance:
    name: Formal Assurance Release Gate (Lean 4 Proofs & Conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Elan & pinned Lean 4 toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/lean-toolchain)"
      - name: Build formal proofs, kernel replay, and axiom audit
        working-directory: formal
        run: |
          lake build
          lake test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run mandatory Python-to-Lean conformance suite
        env:
          STRUCTA_REQUIRE_LEAN_ORACLE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/conformance/ -v

  publish:
    name: Publish to PyPI (Tag Releases Only)
    needs: [qualify, formal-assurance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish via OIDC Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release (Tag Releases Only)
    needs: [qualify, formal-assurance, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist/
      - name: Generate distribution SHA-256 checksums
        run: |
          ls -la dist/
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Extract CHANGELOG release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG_NAME"]
          version = tag.removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          parts = [f"```bash\npip install structa-maestro=={version}\n```"]
          if match and match.group(1).strip():
              parts.append(match.group(1).strip())
          parts.append(
              f"**PyPI**: https://pypi.org/project/structa-maestro/{version}/  \n"
              "**Full Changelog**: https://github.com/ivnmoreno/structa-maestro/blob/main/CHANGELOG.md"
          )
          pathlib.Path("release-notes.md").write_text("\n\n".join(parts) + "\n", encoding="utf-8")
          PY
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          EXTRA_ARGS=()
          if [[ "$TAG_NAME" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              "${EXTRA_ARGS[@]}"
          fi
