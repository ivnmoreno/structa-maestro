name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    name: Security, Dependencies & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static security lint (CI-011)
        run: ruff check --select S src/ evals/
      - name: Run security and adversarial test suite (CI-011)
        run: pytest tests/security/ -v
      - name: Dependency vulnerability scan (CI-012)
        run: pip-audit --skip-editable
      - name: Committed secret pattern scan (CI-013)
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          patterns = [
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"ghp_[A-Za-z0-9]{30,}"),
              re.compile(r"AKIA[0-9A-Z]{16}"),
          ]
          hits = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file():
                  continue
              if any(part in {".git", ".venv", "tests", "dist", "build"} for part in p.parts):
                  continue
              try:
                  txt = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for pat in patterns:
                  if pat.search(txt):
                      hits.append(str(p))
          if hits:
              print("Potential secrets found in:", hits)
              sys.exit(1)
          print("Secret scan passed with 0 hits.")
          PY
