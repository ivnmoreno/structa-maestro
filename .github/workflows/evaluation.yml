name: Evaluation

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-regression:
    name: Golden Dataset Evaluation & Regression (CI-018)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate 50-case golden dataset manifest (CI-018)
        run: python -m evals validate-dataset
      - name: Run golden dataset regression suite (CI-018)
        run: pytest tests/evaluation/ -v
      - name: Run offline baseline regression gate & render summary (CI-018)
        run: |
          python -m evals run \
            --strategy deterministic \
            --baseline evals/baselines/deterministic_v2.0.0.json \
            --output-md eval-summary.md
      - name: Publish evaluation summary to workflow step summary
        if: always()
        run: |
          if [ -f eval-summary.md ]; then
            cat eval-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
