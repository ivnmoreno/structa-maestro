name: Formal Assurance

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-proofs-and-conformance:
    name: Lean 4 Proofs, Axiom Audit & Python Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Elan & pinned Lean 4 toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/lean-toolchain)"

      - name: Build Lean 4 formal project (warningAsError=true)
        working-directory: formal
        run: lake build

      - name: Run programmatic axiom & theorem-inventory audit (zero sorryAx)
        working-directory: formal
        run: lake test

      - name: Run independent Lean kernel proof checker
        working-directory: formal
        run: lake env leanchecker StructaFormal

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Layer 1 & Layer 2 Python-to-Lean conformance suite
        env:
          STRUCTA_REQUIRE_LEAN_ORACLE: "1"
        run: pytest tests/conformance/ -v
