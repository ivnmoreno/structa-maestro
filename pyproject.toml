[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "structa-maestro"
version = "0.1.0"
description = "Structured data extraction engine transforming unstructured documents into validated, traceable canonical records."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "structa-maestro contributors" }]
keywords = ["structured-extraction", "document-processing", "validation", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3.0",
    "pypdf>=4.2,<7.0",
    "python-docx>=1.1,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
structa-maestro = "structa_maestro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/structa_maestro"]

[tool.hatch.build.targets.sdist]
include = [
    "src/structa_maestro/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["structa_maestro", "evals"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "evaluation: golden dataset evaluation and regression tests",
    "security: security and adversarial tests",
    "property: hypothesis property-based tests",
]

[tool.coverage.run]
source = ["structa_maestro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
